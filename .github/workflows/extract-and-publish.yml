name: Publish SAHLAN static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract website files into the deploy root
        run: |
          set -euo pipefail
          ZIP="sahlan-premium-cleaners-logo-quote-v8.zip"
          test -f "$ZIP"
          mkdir -p /tmp/sahlan-site
          unzip -oq "$ZIP" -d /tmp/sahlan-site
          SITE_DIR="/tmp/sahlan-site/sahlan-premium-cleaners"
          test -f "$SITE_DIR/index.html"
          cp -a "$SITE_DIR"/. .
          rm -rf /tmp/sahlan-site
          rm -f "$ZIP"

      - name: Commit extracted site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website file changes to commit."
          else
            git commit -m "Publish SAHLAN website files from uploaded ZIP"
            git push
          fi
